<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Match Scouting</title>
<style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
  margin: 0;
  text-align: center;
}

.section {
  background: #1e1e1e;
  border-radius: 10px;
  padding: 15px;
  margin: 20px auto;
  width: 420px;
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.25);
}

button {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  background-color: red;
  color: white;
  cursor: pointer;
}

.counter {
  margin: 8px 0;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
}

.counter span {
  width: 40px;
}

select, input, textarea {
  margin: 6px 0;
  padding: 8px;
  border-radius: 6px;
  border: none;
  width: 90%;
  text-align: center;
}

.slider {
  width: 90%;
}
</style>
</head>
<body>

<h1>FRC Match Scouting</h1>

<!-- MATCH INFO -->
<div class="section">
<h2>Match Info</h2>
<input id="initials" placeholder="Initials (FML)">
<input id="matchNumber" type="number" placeholder="Match #">
</div>

<script>
function teamBlock(id){
return `
<div class="section">
<h2>Team ${id}</h2>

<input id="team${id}" placeholder="Team # (343)">

<select id="pos${id}">
<option value="">Alliance Position</option>
<option>B1</option><option>B2</option><option>B3</option>
<option>R1</option><option>R2</option><option>R3</option>
</select>

<h3>Ratings (1-10)</h3>

<label>Passing: <span id="passVal${id}">5</span></label><br>
<input type="range" min="1" max="10" value="5" class="slider"
oninput="passVal${id}.innerText=this.value" id="pass${id}">

<br><br>

<label>Shooting: <span id="shootVal${id}">5</span></label><br>
<input type="range" min="1" max="10" value="5" class="slider"
oninput="shootVal${id}.innerText=this.value" id="shoot${id}">

<br><br>

<label>Defense: <span id="defVal${id}">5</span></label><br>
<input type="range" min="1" max="10" value="5" class="slider"
oninput="defVal${id}.innerText=this.value" id="def${id}">


<br><br>

<label>Reliability: <span id="relVal${id}">5</span></label><br>
<input type="range" min="1" max="10" value="5" class="slider"
oninput="relVal${id}.innerText=this.value" id="def${id}">

<textarea id="notes${id}" rows="3" placeholder="Notes"></textarea>

</div>
`;
}
</script>

<div id="teams"></div>

<button onclick="submitData()">Submit</button>

<script>

document.getElementById("teams").innerHTML =
  teamBlock(1) + teamBlock(2) + teamBlock(3);

const API_URL = localStorage.getItem("API_URL");
if (!API_URL) window.location.href = "index.html";


function submitData(){

  const payload = {
    timestamp: new Date().toISOString(),
    initials: initials.value,
    matchNumber: matchNumber.value,
    teams: []
  };

  for(let i=1;i<=3;i++){
    payload.teams.push({
      teamNumber: document.getElementById(`team${i}`).value,
      alliancePos: document.getElementById(`pos${i}`).value,
      passing: document.getElementById(`pass${i}`).value,
      shooting: document.getElementById(`shoot${i}`).value,
      defense: document.getElementById(`def${i}`).value,
      reliability: document.getElementById(`rel${i}`).value,
      notes: document.getElementById(`notes${i}`).value
    });
  }

  fetch(API_URL,{
    method:"POST",
    body: JSON.stringify(payload)
  })
  .then(res=>res.json())
  .then(()=> alert("Submitted!"))
  .catch(()=>alert("Submission failed"));
}

</script>

</body>
</html>
